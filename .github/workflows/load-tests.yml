name: Load Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider to run against"
        required: true
        default: "railway"
        type: choice
        options:
          - railway
          - azure
      group:
        description: "Group to run (all = full suite via run_all.sh)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
      phase:
        description: "Phase to run — ignored when group is 'all'"
        required: true
        default: "moderate"
        type: choice
        options:
          - all
          - moderate
          - stress
      replicas:
        description: "Number of Railway replicas to deploy (Railway provider only)"
        required: false
        default: "1"
        type: string

jobs:
  load-test:
    runs-on: ubuntu-latest
    # Azure: Terraform + image build + Container App deploy (~10 min). PostgreSQL
    # is now persistent — no 8-15 min provision wait.
    timeout-minutes: 60

    # Serialize per provider — both Railway and Azure load tests share the same
    # environment resources (PostgreSQL, replicas). Parallel runs would corrupt data
    # and hit connection limits. workflow_dispatch is manual so pile-ups are rare.
    concurrency:
      group: ${{ inputs.provider }}-load-test
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ── Railway ──────────────────────────────────────────────────────────────
      - name: Install Railway CLI
        if: inputs.provider == 'railway'
        run: npm install -g @railway/cli

      - name: Deploy develop to load-test environment (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Inject replica count into railway.toml before deploying.
          # Upsert: replace existing numReplicas if present, otherwise append.
          # [deploy] is the last section so a plain append lands in the right section.
          if grep -q "^numReplicas" railway.toml; then
            sed -i "s/^numReplicas = .*/numReplicas = ${{ inputs.replicas }}/" railway.toml
          else
            echo "numReplicas = ${{ inputs.replicas }}" >> railway.toml
          fi
          railway up \
            -p "7639518c-e0a7-4cd4-8227-6c2575458620" \
            -e "load-test" \
            -s "GatherYourDeals-data" \
            --detach
          echo "Deployment triggered with ${{ inputs.replicas }} replica(s). Waiting for health check..."

      - name: Resolve load-test URL (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # railway domain uses the project token (already scoped to load-test env).
          # The GraphQL project(id:...) query requires a personal token and fails with project tokens.
          if ! DOMAIN=$(railway domain -s "GatherYourDeals-data" --json 2>&1 | jq -r '.domains[0] // empty'); then
            echo "ERROR: railway domain command failed:"
            echo "$DOMAIN"
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            echo "ERROR: No public domain found for load-test environment."
            railway domain -s "GatherYourDeals-data" --json 2>&1 || true
            exit 1
          fi

          LOAD_TEST_URL="${DOMAIN%/}"
          echo "LOAD_TEST_URL=$LOAD_TEST_URL" >> $GITHUB_ENV
          echo "Load-test URL: $LOAD_TEST_URL"

      # ── Azure ─────────────────────────────────────────────────────────────────
      - name: Install Bicep
        if: inputs.provider == 'azure'
        run: az bicep install

      - name: Azure login
        if: inputs.provider == 'azure'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Register Azure resource providers
        if: inputs.provider == 'azure'
        run: |
          # Contributor role cannot bulk-register all providers (Terraform's default).
          # Register only the namespaces this stack uses; idempotent if already registered.
          az provider register --namespace Microsoft.ContainerRegistry --wait
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

      - name: Set persistent resource names (Azure)
        if: inputs.provider == 'azure'
        run: |
          echo "ACR_LOGIN_SERVER=gydltpersistent.azurecr.io" >> $GITHUB_ENV
          echo "ACR_NAME=gydltpersistent" >> $GITHUB_ENV
          echo "AZ_RESOURCE_GROUP=gyd-persistent" >> $GITHUB_ENV
          PG_FQDN=$(az postgres flexible-server show \
            --name gyd-pg-main \
            --resource-group gyd-persistent \
            --query fullyQualifiedDomainName -o tsv)
          echo "PG_FQDN=${PG_FQDN}" >> $GITHUB_ENV

      - name: Run database migrations (Azure)
        if: inputs.provider == 'azure'
        env:
          AZURE_PG_DSN: ${{ secrets.AZURE_PG_DSN_PERSISTENT }}
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          goose -dir internal/repository/postgres/migrations \
            postgres "$AZURE_PG_DSN" up

      - name: Set up Docker Buildx
        if: inputs.provider == 'azure'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ACR
        if: inputs.provider == 'azure'
        run: |
          # ACR Tasks (az acr build) is blocked by subscription policy.
          # Use local docker buildx build on the runner + docker push instead.
          # GHA layer cache (type=gha) cuts repeat builds from ~10 min to ~1-2 min.
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" -o tsv)
          docker login "$ACR_LOGIN_SERVER" \
            --username "$ACR_NAME" \
            --password "$ACR_ADMIN_PASSWORD"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            -t "${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}" \
            -f Dockerfile .

      - name: Deploy pgBouncer Container App (Azure)
        if: inputs.provider == 'azure'
        env:
          AZURE_PG_DSN: ${{ secrets.AZURE_PG_DSN_PERSISTENT }}
        run: |
          PG_USER=$(python3 -c "import os,urllib.parse; u=urllib.parse.urlparse(os.environ['AZURE_PG_DSN']); print(u.username)")
          PG_PASS=$(python3 -c "import os,urllib.parse; u=urllib.parse.urlparse(os.environ['AZURE_PG_DSN']); print(u.password)")

          if az containerapp show --name gyd-pgbouncer --resource-group gyd-persistent &>/dev/null 2>&1; then
            echo "gyd-pgbouncer exists — updating password secret"
            az containerapp secret set \
              --name gyd-pgbouncer \
              --resource-group gyd-persistent \
              --secrets "pg-password=${PG_PASS}"
          else
            echo "Creating gyd-pgbouncer"
            az containerapp create \
              --name gyd-pgbouncer \
              --resource-group gyd-persistent \
              --environment gyd-lt-env \
              --image edoburu/pgbouncer:latest \
              --ingress internal \
              --target-port 5432 \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --secrets "pg-password=${PG_PASS}" \
              --env-vars \
                "DB_HOST=${PG_FQDN}" \
                "DB_PORT=5432" \
                "DB_USER=${PG_USER}" \
                "DB_PASSWORD=secretref:pg-password" \
                "DB_NAME=gatheryourdeals" \
                "POOL_MODE=session" \
                "MAX_CLIENT_CONN=100" \
                "DEFAULT_POOL_SIZE=20" \
                "SERVER_TLS_SSLMODE=require" \
                "AUTH_TYPE=trust"
          fi

          # Internal FQDN: reachable only within the Container Apps Environment.
          ENV_DOMAIN=$(az containerapp env show \
            --name gyd-lt-env \
            --resource-group gyd-persistent \
            --query properties.defaultDomain -o tsv)
          PGBOUNCER_HOST="gyd-pgbouncer.internal.${ENV_DOMAIN}"
          PG_PASS_ENC=$(python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "${PG_PASS}")
          APP_DSN="postgres://${PG_USER}:${PG_PASS_ENC}@${PGBOUNCER_HOST}:5432/gatheryourdeals?sslmode=disable"
          echo "APP_DSN=${APP_DSN}" >> $GITHUB_ENV

      - name: Deploy gyd-lt to Azure Container Apps
        if: inputs.provider == 'azure'
        env:
          OTEL_HEADERS_SECRET: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          GYD_ADMIN_PASSWORD_SECRET: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_JWT_SECRET_SECRET: ${{ secrets.GYD_JWT_SECRET }}
          GYD_ADMIN_USERNAME_VAL: ${{ secrets.GYD_ADMIN_USERNAME }}
        run: |
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name gydltpersistent \
            --query "passwords[0].value" -o tsv)
          IMAGE="${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}"

          # Delete stale gyd-lt if it exists in a different environment.
          # The VNet-based architecture used a Dedicated plan env; the new architecture
          # uses a Consumption plan env (gyd-lt-env). A stale app from the old env blocks
          # creation in the correct env and cannot be updated to Consumption plan limits.
          if az containerapp show \
              --name gyd-lt \
              --resource-group gyd-persistent &>/dev/null 2>&1; then
            CURRENT_ENV_ID=$(az containerapp show \
              --name gyd-lt \
              --resource-group gyd-persistent \
              --query "properties.managedEnvironmentId" -o tsv)
            TARGET_ENV_ID=$(az containerapp env show \
              --name gyd-lt-env \
              --resource-group gyd-persistent \
              --query "id" -o tsv)
            if [ "${CURRENT_ENV_ID}" != "${TARGET_ENV_ID}" ]; then
              echo "gyd-lt is in wrong environment — deleting stale deployment"
              az containerapp delete \
                --name gyd-lt \
                --resource-group gyd-persistent \
                --yes
            fi
          fi

          # Create (or recreate) gyd-lt in gyd-lt-env.
          # Consumption plan limits: max 2.0 vCPU / 4.0Gi per container.
          # 2 replicas × 2.0 vCPU = 4.0 vCPU total.
          if ! az containerapp show \
              --name gyd-lt \
              --resource-group gyd-persistent &>/dev/null 2>&1; then
            echo "Creating gyd-lt in gyd-lt-env"
            SECRETS_ARGS=(
              "app-database-url=${APP_DSN}"
              "gyd-admin-password=${GYD_ADMIN_PASSWORD_SECRET}"
              "gyd-jwt-secret=${GYD_JWT_SECRET_SECRET}"
            )
            ENV_VARS_ARGS=(
              "GYD_DATABASE_DRIVER=postgres"
              "DATABASE_URL=secretref:app-database-url"
              "GYD_ADMIN_USERNAME=${GYD_ADMIN_USERNAME_VAL}"
              "GYD_ADMIN_PASSWORD=secretref:gyd-admin-password"
              "GYD_JWT_SECRET=secretref:gyd-jwt-secret"
              "OTEL_SERVICE_NAME=gatheryourdeals"
              "OTEL_RESOURCE_ATTRIBUTES=service.environment=load-test,platform.name=azure,db.type=postgres"
              "OTEL_EXPORTER_OTLP_ENDPOINT=https://api.honeycomb.io"
            )
            if [ -n "${OTEL_HEADERS_SECRET}" ]; then
              SECRETS_ARGS+=("otel-headers=${OTEL_HEADERS_SECRET}")
              ENV_VARS_ARGS+=("OTEL_EXPORTER_OTLP_HEADERS=secretref:otel-headers")
            fi
            az containerapp create \
              --name gyd-lt \
              --resource-group gyd-persistent \
              --environment gyd-lt-env \
              --image "${IMAGE}" \
              --registry-server gydltpersistent.azurecr.io \
              --registry-username gydltpersistent \
              --registry-password "${ACR_ADMIN_PASSWORD}" \
              --target-port 8080 \
              --ingress external \
              --transport http \
              --min-replicas 1 \
              --max-replicas 2 \
              --cpu 2.0 \
              --memory 4.0Gi \
              --scale-rule-name "cpu-scaling" \
              --scale-rule-type "cpu" \
              --scale-rule-metadata "type=Utilization" "value=70" \
              --secrets "${SECRETS_ARGS[@]}" \
              --env-vars "${ENV_VARS_ARGS[@]}"
          else
            echo "gyd-lt exists in correct environment — updating image and DSN"
            az containerapp secret set \
              --name gyd-lt \
              --resource-group gyd-persistent \
              --secrets "app-database-url=${APP_DSN}"
            az containerapp update \
              --name gyd-lt \
              --resource-group gyd-persistent \
              --image "${IMAGE}" \
              --cpu 2.0 \
              --memory 4.0Gi \
              --min-replicas 1 \
              --max-replicas 2
          fi

          APP_FQDN=$(az containerapp show \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "LOAD_TEST_URL=https://${APP_FQDN}" >> $GITHUB_ENV
          echo "Container App: https://${APP_FQDN}"

      # ── Provider-agnostic ──────────────────────────────────────────────────────
      - name: Wait for load-test service to be healthy
        run: |
          echo "Polling $LOAD_TEST_URL/health ..."
          curl --retry 30 --retry-delay 10 --retry-connrefused --retry-all-errors \
               --retry-max-time 300 -sf "$LOAD_TEST_URL/health"

      # ── Azure: capture logs if health check fails ─────────────────────────────
      - name: Capture Container App logs (on failure)
        if: failure() && inputs.provider == 'azure'
        run: |
          echo "=== Container App revision status ==="
          az containerapp revision list \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --query "[].{name:name,replicas:properties.replicas,healthState:properties.healthState,runningState:properties.runningState}" \
            -o table 2>/dev/null || true
          echo "=== Container App logs (last 100 lines) ==="
          az containerapp logs show \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --tail 100 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Reset and seed load-test database (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL || '' }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_SEED_WORKERS: "10"
          GYD_SEED_TIMEOUT: "40"
        run: |
          RESET_SQL="TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';"
          # Fetch DATABASE_PUBLIC_URL from Railway-injected environment and reset
          if ! DB_URL=$(railway run \
              -p "7639518c-e0a7-4cd4-8227-6c2575458620" \
              -e "load-test" \
              -s "GatherYourDeals-data" \
              -- sh -c 'echo "$DATABASE_PUBLIC_URL"'); then
            echo "ERROR: Failed to fetch DATABASE_PUBLIC_URL from Railway"
            exit 1
          fi
          if ! psql "$DB_URL" -c "$RESET_SQL"; then
            echo "ERROR: Database reset failed"
            exit 1
          fi
          cd load_testing && python3 seed.py

      - name: Seed load-test database (Azure)
        if: inputs.provider == 'azure'
        env:
          AZURE_PG_DSN: ${{ secrets.AZURE_PG_DSN_PERSISTENT }}
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
        run: |
          # PostgreSQL is publicly accessible — CI connects directly for a clean TRUNCATE.
          RESET_SQL="TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';"
          psql "$AZURE_PG_DSN" -c "$RESET_SQL"
          cd load_testing && python3 seed.py

      - name: Run load tests
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_PHASE: ${{ inputs.phase }}
          GYD_PLATFORM_NAME: ${{ inputs.provider }}
          GYD_DB_TYPE: postgres
          GYD_RESULTS_DIR: results
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          cd load_testing
          mkdir -p results
          if [ "${{ inputs.group }}" = "all" ]; then
            ./run_all.sh
          else
            ./run_group.sh "${{ inputs.group }}" "${{ inputs.phase }}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: load_testing/results/
          retention-days: 30

      # ── Azure: no teardown — all resources are persistent and scale to zero ──────
