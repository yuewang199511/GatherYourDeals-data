name: Load Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider to run against"
        required: true
        default: "railway"
        type: choice
        options:
          - railway
          - azure
      group:
        description: "Group to run (all = full suite via run_all.sh)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
      phase:
        description: "Phase to run — ignored when group is 'all'"
        required: true
        default: "moderate"
        type: choice
        options:
          - all
          - moderate
          - stress
      replicas:
        description: "Number of Railway replicas to deploy (Railway provider only)"
        required: false
        default: "1"
        type: string

jobs:
  load-test:
    runs-on: ubuntu-latest
    # Azure: Terraform + image build + Container App deploy (~10 min). PostgreSQL
    # is now persistent — no 8-15 min provision wait.
    timeout-minutes: 60

    # Serialize per provider — both Railway and Azure load tests share the same
    # environment resources (PostgreSQL, replicas). Parallel runs would corrupt data
    # and hit connection limits. workflow_dispatch is manual so pile-ups are rare.
    concurrency:
      group: ${{ inputs.provider }}-load-test
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ── Railway ──────────────────────────────────────────────────────────────
      - name: Install Railway CLI
        if: inputs.provider == 'railway'
        run: npm install -g @railway/cli

      - name: Deploy develop to load-test environment (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Inject replica count into railway.toml before deploying.
          # Upsert: replace existing numReplicas if present, otherwise append.
          # [deploy] is the last section so a plain append lands in the right section.
          if grep -q "^numReplicas" railway.toml; then
            sed -i "s/^numReplicas = .*/numReplicas = ${{ inputs.replicas }}/" railway.toml
          else
            echo "numReplicas = ${{ inputs.replicas }}" >> railway.toml
          fi
          railway up \
            -p "7639518c-e0a7-4cd4-8227-6c2575458620" \
            -e "load-test" \
            -s "GatherYourDeals-data" \
            --detach
          echo "Deployment triggered with ${{ inputs.replicas }} replica(s). Waiting for health check..."

      - name: Resolve load-test URL (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # railway domain uses the project token (already scoped to load-test env).
          # The GraphQL project(id:...) query requires a personal token and fails with project tokens.
          if ! DOMAIN=$(railway domain -s "GatherYourDeals-data" --json 2>&1 | jq -r '.domains[0] // empty'); then
            echo "ERROR: railway domain command failed:"
            echo "$DOMAIN"
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            echo "ERROR: No public domain found for load-test environment."
            railway domain -s "GatherYourDeals-data" --json 2>&1 || true
            exit 1
          fi

          LOAD_TEST_URL="${DOMAIN%/}"
          echo "LOAD_TEST_URL=$LOAD_TEST_URL" >> $GITHUB_ENV
          echo "Load-test URL: $LOAD_TEST_URL"

      # ── Azure ─────────────────────────────────────────────────────────────────
      - name: Install Terraform
        if: inputs.provider == 'azure'
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        if: inputs.provider == 'azure'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Register Azure resource providers
        if: inputs.provider == 'azure'
        run: |
          # Contributor role cannot bulk-register all providers (Terraform's default).
          # Register only the namespaces this stack uses; idempotent if already registered.
          az provider register --namespace Microsoft.ContainerRegistry --wait
          az provider register --namespace Microsoft.Network --wait
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

      - name: Provision Azure infra (RG + ACR + Container Apps env)
        if: inputs.provider == 'azure'
        env:
          TF_VAR_run_id: ${{ github.run_id }}
          TF_VAR_apps_subnet_id: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/gyd-persistent/providers/Microsoft.Network/virtualNetworks/gyd-vnet/subnets/subnet-apps
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          cd infra/azure
          terraform init
          terraform apply -auto-approve

          ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)
          ACR_NAME=$(terraform output -raw acr_name)
          RESOURCE_GROUP=$(terraform output -raw resource_group_name)
          CA_ENV=$(terraform output -raw container_app_environment_name)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "AZ_RESOURCE_GROUP=$RESOURCE_GROUP" >> $GITHUB_ENV
          echo "AZ_CA_ENV=$CA_ENV" >> $GITHUB_ENV

          # Derive private DSN from the persistent secret — replace public hostname
          # with private hostname that resolves inside the VNet.
          AZ_DATABASE_URL=$(echo "${{ secrets.AZURE_PG_DSN_PERSISTENT }}" | \
            sed 's/\.postgres\.database\.azure\.com/.private.postgres.database.azure.com/')
          echo "AZ_DATABASE_URL=$AZ_DATABASE_URL" >> $GITHUB_ENV

      - name: Build and push image to ACR
        if: inputs.provider == 'azure'
        run: |
          # ACR Tasks (az acr build) is blocked by subscription policy.
          # Use local docker build on the runner + docker push instead.
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" -o tsv)
          docker login "$ACR_LOGIN_SERVER" \
            --username "$ACR_NAME" \
            --password "$ACR_ADMIN_PASSWORD"
          docker build -t "${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}" -f Dockerfile .
          docker push "${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}"

      - name: Deploy app to Azure Container Apps
        if: inputs.provider == 'azure'
        run: |
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" -o tsv)

          # Container Apps (Consumption plan) = scale to zero when idle,
          # billed per vCPU-second used — same model as Railway.
          # CPU/memory set to 4.0/8.0Gi to approximate Railway's 8 vCPU / 8 GB limit
          # (Consumption plan max is 4 vCPU).
          # The environment's VNet integration (subnet-apps) allows this Container App
          # to resolve gyd-pg-main.private.postgres.database.azure.com.
          az containerapp create \
            --name "gyd-lt-${{ github.run_id }}" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --environment "$AZ_CA_ENV" \
            --image "${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}" \
            --registry-server "$ACR_LOGIN_SERVER" \
            --registry-username "$ACR_NAME" \
            --registry-password "$ACR_ADMIN_PASSWORD" \
            --target-port 8080 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 10 \
            --cpu 4.0 --memory 8.0Gi \
            --secrets \
              "database-url=$AZ_DATABASE_URL" \
              "gyd-admin-password=${{ secrets.GYD_ADMIN_PASSWORD }}" \
              "gyd-jwt-secret=${{ secrets.GYD_JWT_SECRET }}" \
              "otel-headers=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
            --env-vars \
              GYD_DATABASE_DRIVER=postgres \
              "GYD_ADMIN_USERNAME=${{ secrets.GYD_ADMIN_USERNAME }}" \
              OTEL_SERVICE_NAME=gatheryourdeals \
              DATABASE_URL=secretref:database-url \
              GYD_ADMIN_PASSWORD=secretref:gyd-admin-password \
              GYD_JWT_SECRET=secretref:gyd-jwt-secret \
              OTEL_EXPORTER_OTLP_HEADERS=secretref:otel-headers

          # Container Apps issues a stable HTTPS FQDN automatically
          APP_FQDN=$(az containerapp show \
            --name "gyd-lt-${{ github.run_id }}" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "LOAD_TEST_URL=https://${APP_FQDN}" >> $GITHUB_ENV
          echo "Container App deployed: https://${APP_FQDN}"

      # ── Provider-agnostic ──────────────────────────────────────────────────────
      - name: Wait for load-test service to be healthy
        run: |
          echo "Polling $LOAD_TEST_URL/health ..."
          curl --retry 30 --retry-delay 10 --retry-connrefused --retry-all-errors \
               --retry-max-time 300 -sf "$LOAD_TEST_URL/health"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Reset and seed load-test database (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL || '' }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_SEED_WORKERS: "10"
          GYD_SEED_TIMEOUT: "40"
        run: |
          RESET_SQL="TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';"
          # Fetch DATABASE_PUBLIC_URL from Railway-injected environment and reset
          if ! DB_URL=$(railway run \
              -p "7639518c-e0a7-4cd4-8227-6c2575458620" \
              -e "load-test" \
              -s "GatherYourDeals-data" \
              -- sh -c 'echo "$DATABASE_PUBLIC_URL"'); then
            echo "ERROR: Failed to fetch DATABASE_PUBLIC_URL from Railway"
            exit 1
          fi
          if ! psql "$DB_URL" -c "$RESET_SQL"; then
            echo "ERROR: Database reset failed"
            exit 1
          fi
          cd load_testing && python3 seed.py

      - name: Reset and seed load-test database (Azure)
        if: inputs.provider == 'azure'
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
        run: |
          # PostgreSQL is VNet-private — CI cannot connect directly via psql.
          # Instead, deploy a Container App Job running postgres:16 inside the VNet.
          # It connects via the private hostname and runs the TRUNCATE SQL, then exits.
          # The job lives in the ephemeral RG and is destroyed with it at teardown.

          # Encode SQL to avoid quoting issues when passing through Container App args.
          RESET_SQL_B64=$(echo "TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';" | base64 -w0)

          az containerapp job create \
            --name "gyd-reset-${{ github.run_id }}" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --environment "$AZ_CA_ENV" \
            --trigger-type Manual \
            --replica-timeout 120 \
            --image postgres:16 \
            --cpu 0.25 --memory 0.5Gi \
            --secrets "pgdsn=$AZ_DATABASE_URL" \
            --env-vars \
              "PG_DSN=secretref:pgdsn" \
              "RESET_SQL_B64=$RESET_SQL_B64" \
            --command "/bin/sh" \
            --args "-c" 'echo $RESET_SQL_B64 | base64 -d | psql "$PG_DSN"'

          EXEC_NAME=$(az containerapp job start \
            --name "gyd-reset-${{ github.run_id }}" \
            --resource-group "$AZ_RESOURCE_GROUP" \
            --query "name" -o tsv)
          echo "Started reset job execution: $EXEC_NAME"

          # Poll for completion (24 × 5 s = 120 s max)
          for i in $(seq 1 24); do
            STATUS=$(az containerapp job execution show \
              --name "gyd-reset-${{ github.run_id }}" \
              --resource-group "$AZ_RESOURCE_GROUP" \
              --job-execution-name "$EXEC_NAME" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Reset job status: $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            if [ "$STATUS" = "Failed" ]; then
              echo "ERROR: DB reset job failed"
              exit 1
            fi
            sleep 5
          done

          if [ "$STATUS" != "Succeeded" ]; then
            echo "ERROR: DB reset job timed out after 120 s"
            exit 1
          fi

          cd load_testing && python3 seed.py

      - name: Run load tests
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_PHASE: ${{ inputs.phase }}
          GYD_PLATFORM_NAME: ${{ inputs.provider }}
          GYD_DB_TYPE: postgres
          GYD_RESULTS_DIR: results
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          cd load_testing
          mkdir -p results
          if [ "${{ inputs.group }}" = "all" ]; then
            ./run_all.sh
          else
            ./run_group.sh "${{ inputs.group }}" "${{ inputs.phase }}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: load_testing/results/
          retention-days: 30

      # ── Azure teardown (runs even if earlier steps failed) ────────────────────
      - name: Teardown Azure infra
        if: always() && inputs.provider == 'azure'
        env:
          TF_VAR_run_id: ${{ github.run_id }}
          TF_VAR_apps_subnet_id: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/gyd-persistent/providers/Microsoft.Network/virtualNetworks/gyd-vnet/subnets/subnet-apps
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          cd infra/azure
          # Terraform destroy removes tracked resources (RG, ACR, Container Apps env).
          # PostgreSQL is persistent — it is NOT destroyed here.
          if [ -f terraform.tfstate ]; then
            terraform destroy -auto-approve || true
          fi
          # Backstop: az group delete cascades to Container Apps and any orphaned resources.
          # The persistent gyd-persistent RG is NOT touched here.
          az group delete \
            --name "gyd-lt-${{ github.run_id }}" \
            --yes --no-wait 2>/dev/null || true
