name: Load Tests

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Load test phase"
        required: true
        default: "moderate"
        type: choice
        options:
          - moderate
          - stress

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    concurrency:
      group: load-test-env
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy and resolve load-test URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --service "GatherYourDeals-data"

          DOMAIN=$(railway domain --json | jq -r '.domain // empty')
          if [ -z "$DOMAIN" ]; then
            echo "ERROR: Could not get domain for load-test environment."
            echo "railway domain output: $(railway domain --json 2>&1)"
            exit 1
          fi

          LOAD_TEST_URL="https://${DOMAIN}"
          echo "LOAD_TEST_URL=$LOAD_TEST_URL" >> $GITHUB_ENV
          echo "Load-test URL: $LOAD_TEST_URL"

      - name: Wait for load-test service to be healthy
        run: |
          echo "Polling $LOAD_TEST_URL/health ..."
          curl --retry 30 --retry-delay 10 --retry-connrefused \
               --retry-max-time 300 -sf "$LOAD_TEST_URL/health"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Reset and seed load-test database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL || '' }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
        run: |
          railway run psql "$DATABASE_URL" -c \
            "TRUNCATE receipts CASCADE; DELETE FROM users WHERE role != 'admin';"
          cd load_testing && python3 seed.py

      - name: Run load tests
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_PHASE: ${{ inputs.phase }}
          GYD_PLATFORM_NAME: railway
          GYD_DB_TYPE: postgres
          GYD_RESULTS_DIR: results
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          cd load_testing
          mkdir -p results
          ./run_all.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: load_testing/results/
          retention-days: 30
