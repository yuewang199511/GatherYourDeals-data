name: Load Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Cloud provider to run against"
        required: true
        default: "railway"
        type: choice
        options:
          - railway
          - azure
      group:
        description: "Group to run (all = full suite via run_all.sh)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1"
          - "2"
          - "3"
          - "4"
      phase:
        description: "Phase to run — ignored when group is 'all'"
        required: true
        default: "moderate"
        type: choice
        options:
          - all
          - moderate
          - stress
      replicas:
        description: "Number of Railway replicas to deploy (Railway provider only)"
        required: false
        default: "1"
        type: string

jobs:
  load-test:
    runs-on: ubuntu-latest
    # Azure: Terraform + image build + Container App deploy (~10 min). PostgreSQL
    # is now persistent — no 8-15 min provision wait.
    timeout-minutes: 60

    # Serialize per provider — both Railway and Azure load tests share the same
    # environment resources (PostgreSQL, replicas). Parallel runs would corrupt data
    # and hit connection limits. workflow_dispatch is manual so pile-ups are rare.
    # NOTE: Railway load tests use the same group as integration-tests.yml so they
    # can never overlap and corrupt the shared load-test DB mid-run.
    concurrency:
      group: ${{ inputs.provider == 'railway' && 'railway-load-test-env' || 'azure-load-test' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # ── Railway ──────────────────────────────────────────────────────────────
      - name: Install Railway CLI
        if: inputs.provider == 'railway'
        run: npm install -g @railway/cli

      - name: Deploy develop to load-test environment (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Inject replica count into railway.toml before deploying.
          # Upsert: replace existing numReplicas if present, otherwise append.
          # [deploy] is the last section so a plain append lands in the right section.
          if grep -q "^numReplicas" railway.toml; then
            sed -i "s/^numReplicas = .*/numReplicas = ${{ inputs.replicas }}/" railway.toml
          else
            echo "numReplicas = ${{ inputs.replicas }}" >> railway.toml
          fi
          railway up \
            -e "load-test" \
            -s "GatherYourDeals-data" \
            --detach
          echo "Deployment triggered with ${{ inputs.replicas }} replica(s). Waiting for health check..."

      - name: Resolve load-test URL (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # railway domain uses the project token (already scoped to load-test env).
          # The GraphQL project(id:...) query requires a personal token and fails with project tokens.
          if ! DOMAIN=$(railway domain -s "GatherYourDeals-data" --json 2>&1 | jq -r '.domains[0] // empty'); then
            echo "ERROR: railway domain command failed:"
            echo "$DOMAIN"
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            echo "ERROR: No public domain found for load-test environment."
            railway domain -s "GatherYourDeals-data" --json 2>&1 || true
            exit 1
          fi

          LOAD_TEST_URL="${DOMAIN%/}"
          echo "LOAD_TEST_URL=$LOAD_TEST_URL" >> $GITHUB_ENV
          echo "Load-test URL: $LOAD_TEST_URL"

      # ── Azure ─────────────────────────────────────────────────────────────────
      - name: Install Bicep
        if: inputs.provider == 'azure'
        run: az bicep install

      - name: Azure login
        if: inputs.provider == 'azure'
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Register Azure resource providers
        if: inputs.provider == 'azure'
        run: |
          # Contributor role cannot bulk-register all providers (Terraform's default).
          # Register only the namespaces this stack uses; idempotent if already registered.
          az provider register --namespace Microsoft.ContainerRegistry --wait
          az provider register --namespace Microsoft.Network --wait
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

      - name: Diagnose persistent network config
        if: inputs.provider == 'azure'
        run: |
          echo "=== VNet DNS servers ==="
          az network vnet show \
            --name gyd-vnet --resource-group gyd-persistent \
            --query "dhcpOptions.dnsServers" -o tsv 2>/dev/null || echo "(none — using Azure default)"
          echo "=== Private DNS zone ==="
          az network private-dns zone show \
            --name "gyd-pg-main.private.postgres.database.azure.com" \
            --resource-group gyd-persistent -o table 2>/dev/null || echo "MISSING"
          echo "=== DNS zone A records ==="
          az network private-dns record-set a list \
            --zone-name "gyd-pg-main.private.postgres.database.azure.com" \
            --resource-group gyd-persistent \
            --query "[].{name:name,ip:aRecords[0].ipv4Address}" -o table 2>/dev/null || echo "NONE"
          echo "=== VNet links for the DNS zone ==="
          az network private-dns link vnet list \
            --zone-name "gyd-pg-main.private.postgres.database.azure.com" \
            --resource-group gyd-persistent \
            --query "[].{name:name,vnet:virtualNetwork.id,state:registrationEnabled}" -o table 2>/dev/null || echo "NONE"

      - name: Set persistent resource names and resolve PG DSN (Azure)
        if: inputs.provider == 'azure'
        env:
          AZURE_PG_DSN: ${{ secrets.AZURE_PG_DSN_PERSISTENT }}
        run: |
          # All Azure load-test resources are persistent — no provisioning needed per run.
          echo "ACR_LOGIN_SERVER=gydltpersistent.azurecr.io" >> $GITHUB_ENV
          echo "ACR_NAME=gydltpersistent" >> $GITHUB_ENV
          echo "AZ_RESOURCE_GROUP=gyd-persistent" >> $GITHUB_ENV

          # Resolve PostgreSQL private IP from the DNS zone A record.
          # Container Apps DNS (127.0.0.11) cannot resolve private DNS zones;
          # inject the IP directly into the DSN to bypass DNS entirely.
          PG_ZONE="gyd-pg-main.private.postgres.database.azure.com"
          PG_PRIVATE_IP=$(az network private-dns record-set a list \
            --zone-name "$PG_ZONE" \
            --resource-group "gyd-persistent" \
            --query "[0].aRecords[0].ipv4Address" -o tsv 2>/dev/null || true)

          if [ -n "$PG_PRIVATE_IP" ]; then
            echo "Resolved PostgreSQL private IP: $PG_PRIVATE_IP"
            HOST_PART="@${PG_PRIVATE_IP}"
          else
            echo "WARNING: Could not resolve PostgreSQL private IP — using private hostname"
            HOST_PART="@gyd-pg-main.private.postgres.database.azure.com"
          fi

          # Extract credentials from the secret DSN using Python URL parser (handles special chars)
          PG_USER=$(python3 -c "import os,urllib.parse; u=urllib.parse.urlparse(os.environ['AZURE_PG_DSN']); print(u.username)")
          PG_PASS=$(python3 -c "import os,urllib.parse; u=urllib.parse.urlparse(os.environ['AZURE_PG_DSN']); print(u.password)")

          # PG_DIRECT_DSN: PgBouncer sidecar → PostgreSQL (real IP, port 5432, TLS required)
          PG_DIRECT_DSN="postgres://${PG_USER}:${PG_PASS}${HOST_PART}:5432/gatheryourdeals?sslmode=require"

          # APP_DSN: Go service → PgBouncer sidecar on localhost (no TLS on loopback)
          APP_DSN="postgres://${PG_USER}:${PG_PASS}@localhost:6432/gatheryourdeals?sslmode=disable"

          echo "PG_DIRECT_DSN=$PG_DIRECT_DSN" >> $GITHUB_ENV
          echo "APP_DSN=$APP_DSN" >> $GITHUB_ENV

      - name: Ensure Container Apps Environment exists (Azure)
        if: inputs.provider == 'azure'
        run: |
          if az containerapp env show \
              --name gyd-lt-env \
              --resource-group gyd-persistent &>/dev/null 2>&1; then
            echo "gyd-lt-env already exists — skipping creation"
          else
            echo "Creating gyd-lt-env (one-time, ~5-10 min)..."
            SUBNET_ID=$(az network vnet subnet show \
              --vnet-name gyd-vnet \
              --resource-group gyd-persistent \
              --name subnet-apps \
              --query id -o tsv)
            az containerapp env create \
              --name gyd-lt-env \
              --resource-group gyd-persistent \
              --location westus3 \
              --infrastructure-subnet-resource-id "$SUBNET_ID"
            echo "gyd-lt-env created"
          fi

      - name: Set up Docker Buildx
        if: inputs.provider == 'azure'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ACR
        if: inputs.provider == 'azure'
        run: |
          # ACR Tasks (az acr build) is blocked by subscription policy.
          # Use local docker buildx build on the runner + docker push instead.
          # GHA layer cache (type=gha) cuts repeat builds from ~10 min to ~1-2 min.
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" -o tsv)
          docker login "$ACR_LOGIN_SERVER" \
            --username "$ACR_NAME" \
            --password "$ACR_ADMIN_PASSWORD"
          docker buildx build \
            --push \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            -t "${ACR_LOGIN_SERVER}/gatheryourdeals:${{ github.sha }}" \
            -f Dockerfile .

      - name: Deploy app to Azure Container Apps
        if: inputs.provider == 'azure'
        env:
          OTEL_HEADERS_SECRET: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          GYD_ADMIN_PASSWORD_SECRET: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_JWT_SECRET_SECRET: ${{ secrets.GYD_JWT_SECRET }}
          GYD_ADMIN_USERNAME_VAL: ${{ secrets.GYD_ADMIN_USERNAME }}
        run: |
          ACR_ADMIN_PASSWORD=$(az acr credential show \
            --name gydltpersistent \
            --query "passwords[0].value" -o tsv)

          # Fetch CA Environment resource ID (required for YAML create)
          ENV_ID=$(az containerapp env show \
            --name gyd-lt-env \
            --resource-group gyd-persistent \
            --query id -o tsv)

          # Stamp the committed template into a working copy and substitute placeholders.
          # The template lives in infra/azure/persistent/container-app.yaml; no heredoc
          # is used here because heredoc content at column 0 breaks the workflow YAML parser.
          cp infra/azure/persistent/container-app.yaml /tmp/gyd-lt.yaml

          # Use | as sed delimiter — values may contain slashes (DSN, image refs).
          sed -i "s|__ENV_ID__|${ENV_ID}|g"                         /tmp/gyd-lt.yaml
          sed -i "s|__IMAGE__|gydltpersistent.azurecr.io/gatheryourdeals:${{ github.sha }}|g" /tmp/gyd-lt.yaml
          sed -i "s|__ACR_PASSWORD__|${ACR_ADMIN_PASSWORD}|g"       /tmp/gyd-lt.yaml
          sed -i "s|__PG_DSN__|${PG_DIRECT_DSN}|g"                  /tmp/gyd-lt.yaml
          sed -i "s|__APP_DSN__|${APP_DSN}|g"                       /tmp/gyd-lt.yaml
          sed -i "s|__ADMIN_USERNAME__|${GYD_ADMIN_USERNAME_VAL}|g" /tmp/gyd-lt.yaml
          sed -i "s|__ADMIN_PASSWORD__|${GYD_ADMIN_PASSWORD_SECRET}|g" /tmp/gyd-lt.yaml
          sed -i "s|__JWT_SECRET__|${GYD_JWT_SECRET_SECRET}|g"      /tmp/gyd-lt.yaml

          # OTEL headers: substitute if set, remove those lines if unset.
          if [ -n "$OTEL_HEADERS_SECRET" ]; then
            sed -i "s|__OTEL_HEADERS__|${OTEL_HEADERS_SECRET}|g" /tmp/gyd-lt.yaml
          else
            sed -i '/__OTEL_HEADERS__/d' /tmp/gyd-lt.yaml
          fi

          # Create or update (--yaml replaces full spec including secrets and containers)
          if az containerapp show --name gyd-lt --resource-group gyd-persistent &>/dev/null 2>&1; then
            echo "Container App exists — updating with new image and sidecar config"
            az containerapp update \
              --name gyd-lt \
              --resource-group gyd-persistent \
              --yaml /tmp/gyd-lt.yaml
          else
            echo "Container App not found — creating with PgBouncer sidecar"
            az containerapp create \
              --resource-group gyd-persistent \
              --yaml /tmp/gyd-lt.yaml
          fi

          APP_FQDN=$(az containerapp show \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "LOAD_TEST_URL=https://${APP_FQDN}" >> $GITHUB_ENV
          echo "Container App: https://${APP_FQDN}"

      # ── Provider-agnostic ──────────────────────────────────────────────────────
      - name: Wait for load-test service to be healthy
        run: |
          echo "Polling $LOAD_TEST_URL/health ..."
          curl --retry 9 --retry-delay 10 --retry-connrefused --retry-all-errors \
               --retry-max-time 90 -sf "$LOAD_TEST_URL/health"

      # ── Azure: capture logs if health check fails ─────────────────────────────
      - name: Capture Container App logs (on failure)
        if: failure() && inputs.provider == 'azure'
        run: |
          echo "=== Container App revision status ==="
          az containerapp revision list \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --query "[].{name:name,replicas:properties.replicas,healthState:properties.healthState,runningState:properties.runningState}" \
            -o table 2>/dev/null || true
          echo "=== Container App logs (last 100 lines) ==="
          az containerapp logs show \
            --name gyd-lt \
            --resource-group gyd-persistent \
            --tail 100 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Reset and seed load-test database (Railway)
        if: inputs.provider == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL || '' }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_SEED_WORKERS: "10"
          GYD_SEED_TIMEOUT: "40"
        run: |
          RESET_SQL="TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';"
          # Fetch DATABASE_PUBLIC_URL from Railway-injected environment and reset
          if ! DB_URL=$(railway run \
              -p "7639518c-e0a7-4cd4-8227-6c2575458620" \
              -e "load-test" \
              -s "GatherYourDeals-data" \
              -- sh -c 'echo "$DATABASE_PUBLIC_URL"'); then
            echo "ERROR: Failed to fetch DATABASE_PUBLIC_URL from Railway"
            exit 1
          fi
          if ! psql "$DB_URL" -c "$RESET_SQL"; then
            echo "ERROR: Database reset failed"
            exit 1
          fi
          cd load_testing && python3 seed.py

      - name: Seed load-test database (Azure)
        if: inputs.provider == 'azure'
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
        run: |
          # PostgreSQL is VNet-private — CI cannot connect directly for a TRUNCATE.
          # seed.py is idempotent: 409 on duplicate user is handled gracefully.
          # On a fresh persistent DB the tables are empty; on repeat runs old
          # receipts accumulate but do not affect test correctness (guardrail
          # checks ≥1000 receipts, not exactly 1000).
          cd load_testing && python3 seed.py

      - name: Run load tests
        env:
          GYD_TARGET_URL: ${{ env.LOAD_TEST_URL }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_PHASE: ${{ inputs.phase }}
          GYD_PLATFORM_NAME: ${{ inputs.provider }}
          GYD_DB_TYPE: postgres
          GYD_RESULTS_DIR: results
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        run: |
          cd load_testing
          mkdir -p results
          if [ "${{ inputs.group }}" = "all" ]; then
            ./run_all.sh
          else
            ./run_group.sh "${{ inputs.group }}" "${{ inputs.phase }}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: load_testing/results/
          retention-days: 30

      # ── Azure: no teardown — all resources are persistent and scale to zero ──────
