name: Integration Tests

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # All runs share the load-test Railway environment — serialize to prevent
    # concurrent deploys and test data conflicts.
    concurrency:
      group: load-test-env
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to load-test and wait for healthy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service "GatherYourDeals-data"

          # Use if-condition to prevent set -e from silently exiting on non-zero exit code
          if ! DOMAIN=$(railway domain -s "GatherYourDeals-data" --json 2>&1 | jq -r '.domains[0] // empty'); then
            echo "ERROR: railway domain command failed:"
            echo "$DOMAIN"
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            echo "ERROR: Could not get domain for load-test environment."
            railway domain -s "GatherYourDeals-data" --json 2>&1 || true
            exit 1
          fi

          echo "TARGET_URL=${DOMAIN}" >> $GITHUB_ENV
          echo "Target URL: ${DOMAIN}"

      - name: Wait for service to be healthy
        run: |
          curl --retry 30 --retry-delay 10 --retry-connrefused --retry-all-errors \
               --retry-max-time 300 -sf "$TARGET_URL/health"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r load_testing/requirements.txt

      - name: Reset database
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          RESET_SQL="TRUNCATE receipts CASCADE; TRUNCATE meta_fields CASCADE; DELETE FROM users WHERE role != 'admin';"
          # railway run injects Railway env vars locally; psql connects via DATABASE_PUBLIC_URL
          # Use if-condition to capture failure rather than letting set -e exit silently
          if ! railway run --service "GatherYourDeals-data" -- \
               psql "$DATABASE_PUBLIC_URL" -c "$RESET_SQL"; then
            echo "ERROR: Database reset failed"
            exit 1
          fi

      - name: Run integration tests
        env:
          GYD_TARGET_URL: ${{ env.TARGET_URL || '' }}
          GYD_TEST_USERNAME: ${{ secrets.GYD_TEST_USERNAME }}
          GYD_TEST_PASSWORD: ${{ secrets.GYD_TEST_PASSWORD }}
          GYD_ADMIN_USERNAME: ${{ secrets.GYD_ADMIN_USERNAME }}
          GYD_ADMIN_PASSWORD: ${{ secrets.GYD_ADMIN_PASSWORD }}
          GYD_TEST_RUN_ID: "ci_${{ github.run_id }}_${{ github.run_attempt }}"
        run: |
          cd load_testing
          python3 -m pytest integration/ -v
