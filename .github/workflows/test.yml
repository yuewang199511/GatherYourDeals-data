name: Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '**.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Run tests
      env:
        CGO_ENABLED: "1"
      run: go test -v ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Run tests with race detector
      env:
        CGO_ENABLED: "1"
      run: go test -race -v ./...
